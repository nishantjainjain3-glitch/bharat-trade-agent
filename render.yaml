services:
  - type: web
    name: bharat-trade-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.server:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: AUTOTRADE_ENABLED
        value: "true"
      - key: LIVE_EXECUTION_ENABLED
        value: "true"
      - key: TRADE_EXECUTION_LOCKED
        value: "false"
